<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>IriDuo</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#EAF0F7;
    font-family:system-ui,sans-serif;-webkit-user-select:none;user-select:none}
  [hidden]{display:none!important}
  #stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #anteprima{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
  #hint{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    color:#9DB0C8;font-size:16px;text-align:center;padding:16px;pointer-events:none}
  #file{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(14,26,43,.88)}
  #file label{border:2px dashed #5CC8E0;border-radius:14px;padding:18px 22px;font-size:18px;font-weight:700;
    color:#5CC8E0;text-align:center;max-width:80%}
  #file input{display:none}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<video id="anteprima" autoplay muted playsinline hidden></video>
<div id="hint">In attesa del video…</div>
<div id="file" hidden><label>Tocca qui per scegliere un video VR180<input type="file" id="fileProva" accept="video/*"></label></div>
<audio id="audioRemoto" autoplay></audio>

<script src="lib/three.min.js"></script>
<script src="lib/peerjs.min.js"></script>
<script>
const PREFISSO = 'vr180chiamata-';
let codiceFisso = (new URLSearchParams(location.search).get('fixed') || '').match(/^\d{6}$/) ? new URLSearchParams(location.search).get('fixed') : null;
const MODE = new URLSearchParams(location.search).get('mode') || 'viewer';
const $ = id => document.getElementById(id);

/* ---------- ponte con l'app ---------- */
function send(o){
  const s = JSON.stringify(o);
  if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(s);
  else if (window.parent !== window) window.parent.postMessage(s, location.origin);
}
const handlers = {};
window.app = { cmd(c){ const h = handlers[c && c.type]; if (h) { try { h(c); } catch (e) { send({ type:'status', text:'Errore: ' + e.message }); } } } };
addEventListener('message', e => {
  if (e.origin !== location.origin || e.source !== window.parent) return;
  let c = e.data;
  if (typeof c === 'string') { try { c = JSON.parse(c); } catch { return; } }
  if (c && c.__cmd) window.app.cmd(c);
});
const stato = t => send({ type:'status', text:t });
const hint = (t) => { $('hint').hidden = !t; if (t) $('hint').textContent = t; };

/* =================== STATISTICHE =================== */
let timerStats = null;
function avviaStats(pc, verso){
  fermaStats();
  let prec = null;
  const mio = setInterval(async () => {
    if (!pc || pc.connectionState === 'closed') return;
    let rep; try { rep = await pc.getStats(); } catch { return; }
    if (timerStats !== mio) return;
    let bytes = 0, fps = 0, w = 0, h = 0, persi = 0, pacchetti = 0, rtt = null, frazione = null;
    rep.forEach(r => {
      if (r.kind !== 'video' && r.type !== 'candidate-pair') return;
      if (verso === 'in' && r.type === 'inbound-rtp') {
        bytes = r.bytesReceived || 0; fps = r.framesPerSecond || 0; w = r.frameWidth || 0; h = r.frameHeight || 0;
        persi = r.packetsLost || 0; pacchetti = r.packetsReceived || 0;
      }
      if (verso === 'out' && r.type === 'outbound-rtp') {
        bytes = r.bytesSent || 0; fps = r.framesPerSecond || 0; w = r.frameWidth || 0; h = r.frameHeight || 0;
      }
      if (verso === 'out' && r.type === 'remote-inbound-rtp') {
        if (typeof r.fractionLost === 'number') frazione = r.fractionLost;
        if (typeof r.roundTripTime === 'number') rtt = r.roundTripTime;
      }
      if (r.type === 'candidate-pair' && r.nominated && r.state === 'succeeded' && typeof r.currentRoundTripTime === 'number') rtt = r.currentRoundTripTime;
    });
    const ora = performance.now();
    let kbps = 0, perdita = frazione !== null ? frazione * 100 : 0;
    if (prec) {
      const dt = (ora - prec.t) / 1000;
      if (dt > 0) kbps = Math.max(0, (bytes - prec.bytes) * 8 / 1000 / dt);
      if (verso === 'in') {
        const dp = (persi - prec.persi), dr = (pacchetti - prec.pacchetti);
        perdita = dp + dr > 0 ? Math.max(0, dp) / (dp + dr) * 100 : 0;
      }
      send({ type:'stats', kbps: Math.round(kbps), fps: Math.round(fps), w, h, rtt: rtt === null ? null : Math.round(rtt * 1000), loss: Math.round(perdita * 10) / 10 });
    }
    prec = { t: ora, bytes, persi, pacchetti };
  }, 2000);
  timerStats = mio;
}
function fermaStats(){ clearInterval(timerStats); timerStats = null; }

/* =================== VISORE =================== */
let renderer, scena, camera, video, texture, mesh = [], canvas;
let formato = 'sbs', scambia = false, vista = 'drag', moto = false, yaw = 0, pitch = 0;
let peerV, attesa = null, chiamataV = null, micV = null;
const canali = {};
const rifiutiInSospeso = new Set();
const qDev = new THREE.Quaternion(), qOff = new THREE.Quaternion();
let haOff = false, haDati = false, mediaAttivo = false;
const mostraMedia = on => { mediaAttivo = on; mesh.forEach(m => m.visible = on); };

function avviaVisore(){
  video = document.createElement('video');
  video.playsInline = true; video.setAttribute('playsinline', ''); video.crossOrigin = 'anonymous';
  video.addEventListener('playing', () => { hint(null); mostraMedia(true); });
  canvas = $('stage');
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  scena = new THREE.Scene();
  scena.background = new THREE.Color(0x000000);
  camera = new THREE.PerspectiveCamera(75, 16/9, 0.1, 100);
  texture = new THREE.VideoTexture(video);
  texture.colorSpace = THREE.SRGBColorSpace;
  costruisciSfere();
  ridimensiona(); addEventListener('resize', ridimensiona);
  trascinamento(canvas);
  renderer.setAnimationLoop(disegna);
  avviaPeerVisore();
}


/* ---------- demo 3D generate al volo (nessun file) ---------- */
let demo = null, demoCanvas = null, demoTex = null;
const COL = ['#5CC8E0', '#E0605C', '#E0A85C', '#5CE093', '#EAF0F7'];
const rnd = (() => { let x = 7; return () => (x = (x * 16807) % 2147483647) / 2147483647; })();
const stelle = Array.from({ length: 260 }, () => ({ x: rnd(), y: rnd(), z: 6 + rnd() * 6, r: 0.6 + rnd() * 1.6 }));
const sfere = Array.from({ length: 34 }, (_, i) => ({ x: rnd(), y: 0.2 + rnd() * 0.6, z: 1 + rnd() * 4, c: COL[i % 5], v: (rnd() - 0.5) * 0.03, f: rnd() * 6 }));
const DEMO_NOMI = { sfere: 'Sfere fluttuanti', tunnel: 'Tunnel di luce', stelle: 'Cielo e scritta 3D' };

function texAttuale(){ return demo ? demoTex : texture; }

function preparaDemo(){
  if (!demoCanvas) demoCanvas = document.createElement('canvas');
  demoCanvas.width = formato === 'sbs' ? 2048 : 1024;
  demoCanvas.height = formato === 'sbs' ? 1024 : 2048;
  if (demoTex) demoTex.dispose();
  demoTex = new THREE.CanvasTexture(demoCanvas);
  demoTex.colorSpace = THREE.SRGBColorSpace;
}

function sfondo(ctx, w, h){
  const g = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w * 0.75);
  g.addColorStop(0, '#17283F'); g.addColorStop(1, '#05080F');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
}
function disegnaStelle(ctx, w, h, s, K){
  ctx.fillStyle = '#EAF0F7';
  for (const st of stelle) { ctx.globalAlpha = 0.5 + 0.5 * (st.r / 2.2); ctx.fillRect(st.x * w + s * K / st.z / 2, st.y * h, st.r, st.r); }
  ctx.globalAlpha = 1;
}

function disegnaOcchio(ctx, w, h, t, s){
  const K = w * 0.035; // disparità massima (px) per oggetti vicini
  sfondo(ctx, w, h);
  if (demo === 'sfere') {
    disegnaStelle(ctx, w, h, s, K);
    const ord = [...sfere].sort((a, b) => b.z - a.z);
    for (const b of ord) {
      const x = (((b.x + t * b.v) % 1) + 1) % 1 * w + s * K / b.z / 2;
      const y = b.y * h + Math.sin(t * 0.8 + b.f) * h * 0.03;
      const r = w * 0.06 / b.z;
      const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r);
      g.addColorStop(0, '#FFFFFF'); g.addColorStop(0.25, b.c); g.addColorStop(1, '#0E1A2B');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    }
  } else if (demo === 'tunnel') {
    for (let k = 14; k >= 0; k--) {
      const z = (((k - t * 1.2) % 14) + 14) % 14 + 0.6;
      const r = w * 0.18 / z * 3;
      const cx = w / 2 + s * K / z / 2, cy = h / 2;
      ctx.strokeStyle = COL[k % 5]; ctx.globalAlpha = Math.min(1, 2 / z);
      ctx.lineWidth = Math.max(1, 14 / z);
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  } else {
    disegnaStelle(ctx, w, h, s, K);
    const z1 = 1.3 + Math.sin(t * 0.7) * 0.25;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `bold ${Math.round(w * 0.16)}px system-ui, sans-serif`;
    ctx.fillStyle = '#5CC8E0';
    ctx.fillText('VR180', w / 2 + s * K / z1 / 2, h * 0.47);
    ctx.font = `bold ${Math.round(w * 0.05)}px system-ui, sans-serif`;
    ctx.fillStyle = '#EAF0F7';
    ctx.fillText('Chiamata 3D', w / 2 + s * K / 3 / 2, h * 0.6);
  }
}

function disegnaDemo(t){
  const ctx = demoCanvas.getContext('2d');
  const W = demoCanvas.width, H = demoCanvas.height, sbs = formato === 'sbs';
  const ew = sbs ? W / 2 : W, eh = sbs ? H : H / 2;
  for (const occhio of [0, 1]) {
    ctx.save();
    ctx.translate(sbs ? occhio * ew : 0, sbs ? 0 : occhio * eh);
    ctx.beginPath(); ctx.rect(0, 0, ew, eh); ctx.clip();
    disegnaOcchio(ctx, ew, eh, t, occhio === 0 ? 1 : -1);
    ctx.restore();
  }
  demoTex.needsUpdate = true;
}

function fermaDemo(){ if (!demo) return; demo = null; costruisciSfere(); }

handlers.demo = c => {
  if (chiamataV) { stato('Chiudi prima la chiamata per provare una demo.'); return; }
  if (!DEMO_NOMI[c.name]) return;
  video.pause(); video.srcObject = null; video.removeAttribute('src'); video.load();
  $('file').hidden = true;
  demo = c.name; preparaDemo(); costruisciSfere(); mostraMedia(true); hint(null);
  stato('Demo 3D: ' + DEMO_NOMI[c.name] + '. Guardati intorno.');
  send({ type:'test', name: c.name });
};
handlers.stopDemo = () => {
  if (!demo) return;
  fermaDemo(); mostraMedia(false); hint('In attesa del video…');
  send({ type:'test', name: null });
  stato('In attesa di chiamata.');
};

function costruisciSfere(){
  mesh.forEach(m => { scena.remove(m); m.geometry.dispose(); m.material.dispose(); });
  mesh = [];
  for (const occhio of [0, 1]) {
    const g = new THREE.SphereGeometry(10, 96, 48, Math.PI, Math.PI);
    g.scale(-1, 1, 1);
    const uv = g.attributes.uv;
    const sorgente = scambia ? 1 - occhio : occhio;
    for (let i = 0; i < uv.count; i++) {
      let u = uv.getX(i), v = uv.getY(i);
      if (formato === 'sbs') u = u * 0.5 + sorgente * 0.5;
      else v = v * 0.5 + (sorgente === 0 ? 0.5 : 0);
      uv.setXY(i, u, v);
    }
    const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ map: texAttuale() }));
    m.layers.set(occhio + 1);
    m.visible = mediaAttivo;
    scena.add(m); mesh.push(m);
  }
}

function ridimensiona(){ renderer.setSize(canvas.clientWidth, canvas.clientHeight, false); }

function disegna(){
  if (demo && demo !== 'foto') disegnaDemo(performance.now() / 1000);
  animaReazioni();
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (moto && haDati) camera.quaternion.copy(qOff).multiply(qDev);
  else camera.rotation.set(pitch, yaw, 0, 'YXZ');
  if (vista === 'split') {
    const hw = w / 2;
    camera.aspect = hw / h; camera.fov = 85; camera.updateProjectionMatrix();
    renderer.setScissorTest(true);
    for (const [layer, x] of [[1, 0], [2, hw]]) {
      camera.layers.set(layer);
      renderer.setViewport(x, 0, hw, h); renderer.setScissor(x, 0, hw, h);
      renderer.render(scena, camera);
    }
    renderer.setScissorTest(false);
  } else {
    camera.aspect = w / h; camera.fov = 75; camera.updateProjectionMatrix();
    camera.layers.set(1);
    renderer.setViewport(0, 0, w, h);
    renderer.render(scena, camera);
  }
}

function trascinamento(c){
  let t = null;
  c.addEventListener('pointerdown', e => {
    if (video.paused && (video.srcObject || video.src)) video.play().catch(() => {});
    t = { x: e.clientX, y: e.clientY, yaw, pitch }; c.setPointerCapture(e.pointerId);
  });
  c.addEventListener('pointermove', e => {
    if (!t) return;
    yaw = t.yaw + (e.clientX - t.x) * 0.005;
    pitch = Math.max(-1.4, Math.min(1.4, t.pitch + (e.clientY - t.y) * 0.005));
  });
  c.addEventListener('pointerup', () => t = null);
  c.addEventListener('pointercancel', () => t = null);
}

const E = new THREE.Euler(), Q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));
const Z = new THREE.Vector3(0, 0, 1), Y = new THREE.Vector3(0, 1, 0), Q0 = new THREE.Quaternion();
handlers.orient = c => {
  E.set(c.b, c.a, -c.g, 'YXZ');
  qDev.setFromEuler(E); qDev.multiply(Q1);
  qDev.multiply(Q0.setFromAxisAngle(Z, -(c.o || 0) * Math.PI / 180));
  if (!haOff) {
    const e = new THREE.Euler().setFromQuaternion(qDev, 'YXZ');
    qOff.setFromAxisAngle(Y, -e.y); haOff = true;
  }
  haDati = true;
};
handlers.setMotion = c => { moto = !!c.on; haOff = false; haDati = false; };
handlers.recenter = () => { haOff = false; yaw = 0; pitch = 0; };
handlers.setFormat = c => { formato = c.value === 'tb' ? 'tb' : 'sbs'; if (demo && demo !== 'foto') preparaDemo(); costruisciSfere(); };
handlers.showImage = c => {
  if (chiamataV) { stato('Chiudi prima la chiamata per guardare una foto.'); return; }
  const img = new Image();
  img.onload = () => {
    video.pause(); video.srcObject = null; video.removeAttribute('src'); video.load();
    if (!demoCanvas) demoCanvas = document.createElement('canvas');
    demoCanvas.width = img.naturalWidth; demoCanvas.height = img.naturalHeight;
    demoCanvas.getContext('2d').drawImage(img, 0, 0);
    if (demoTex) demoTex.dispose();
    demoTex = new THREE.CanvasTexture(demoCanvas); demoTex.colorSpace = THREE.SRGBColorSpace;
    demo = 'foto'; costruisciSfere(); mostraMedia(true); hint(null);
    stato('Foto 3D: ' + String(c.name || '') + '. Guardati intorno.');
    send({ type:'test', name: 'foto' });
  };
  img.onerror = () => stato('Non riesco ad aprire la foto.');
  img.src = 'data:image/jpeg;base64,' + String(c.data || '');
};
handlers.setSwap = c => { scambia = !!c.on; costruisciSfere(); };
handlers.setView = c => { vista = c.value === 'split' ? 'split' : 'drag'; };
handlers.showFile = c => { $('file').hidden = !c.on; $('hint').style.visibility = c.on ? 'hidden' : ''; };
handlers.restart = () => location.reload();

function avviaPeerVisore(){
  const rnd32 = new Uint32Array(1); crypto.getRandomValues(rnd32);
  const codice = codiceFisso || String(100000 + (rnd32[0] % 900000));
  peerV = new Peer(PREFISSO + codice);
  peerV.on('open', () => { send({ type:'code', code: codice }); stato(msgDopoCodice || 'In attesa di chiamata.'); msgDopoCodice = null; });
  peerV.on('error', e => {
    if (e.type === 'unavailable-id') { if (codiceFisso) { codiceFisso = null; send({ type:'codeTaken' }); } peerV.destroy(); avviaPeerVisore(); }
    else if (e.type !== 'peer-unavailable') { send({ type:'error', text:'Errore di collegamento (' + e.type + ').' }); }
  });
  const questoPeer = peerV;
  peerV.on('disconnected', () => { if (peerV === questoPeer && !questoPeer.destroyed) questoPeer.reconnect(); });
  peerV.on('connection', dc => {
    canali[dc.peer] = dc;
    dc.on('open', () => {
      if (rifiutiInSospeso.has(dc.peer)) { rifiutiInSospeso.delete(dc.peer); try { dc.send({ t:'decline' }); } catch {} }
    });
    dc.on('data', d => {
      if (d && d.t === 'cancel' && canali[dc.peer] === dc) annullata(dc.peer);
      if (d && d.t === 'chat' && chiamataV && chiamataV.peer === dc.peer) send({ type:'chat', text: String(d.text || '').slice(0, 300), from: /^\d{6}$/.test(String(d.from || '')) ? String(d.from) : undefined });
      if (d && d.t === 'react' && chiamataV && chiamataV.peer === dc.peer) reazioneRicevuta(String(d.kind));
    });
    dc.on('close', () => { if (canali[dc.peer] !== dc) return; delete canali[dc.peer]; annullata(dc.peer); });
  });
  peerV.on('call', c => {
    const adesso = Date.now();
    chiamateRecenti = chiamateRecenti.filter(t => adesso - t < 60000); chiamateRecenti.push(adesso);
    if (!chiamataV && chiamateRecenti.length > 5) {
      c.close(); if (attesa) { attesa.close(); attesa = null; }
      chiamateRecenti = [];
      send({ type:'ended' });
      msgDopoCodice = 'Troppe chiamate in poco tempo: per sicurezza ho creato un nuovo codice.';
      stato(msgDopoCodice);
      rigeneraCodice(); return;
    }
    if (chiamataV || attesa) { c.close(); return; }
    attesa = c;
    send({ type:'incoming' });
    stato('Chiamata in arrivo.');
  });
}

let chiamateRecenti = [], msgDopoCodice = null;
function rigeneraCodice(){
  if (chiamataV) return;
  codiceFisso = null;
  if (attesa) { attesa.close(); attesa = null; }
  const vecchio = peerV; peerV = null;
  if (vecchio) vecchio.destroy();
  avviaPeerVisore();
}
handlers.newCode = () => { if (chiamataV) return; send({ type:'ended' }); stato('Nuovo codice in arrivo…'); rigeneraCodice(); };

function annullata(peer){
  if (!attesa || attesa.peer !== peer) return;
  attesa.close(); attesa = null;
  send({ type:'ended' });
  stato('Chiamata annullata da chi chiamava. In attesa di chiamata.');
}

handlers.answer = async () => {
  if (!attesa) return;
  try { micV = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true } }); }
  catch { micV = null; stato('Microfono non disponibile: l\'altra persona non ti sentirà.'); }
  if (!attesa) { if (micV) micV.getTracks().forEach(t => t.stop()); micV = null; return; }
  const c = attesa; attesa = null; chiamataV = c;
  fermaDemo();
  c.answer(micV || undefined);
  const pcV = c.peerConnection;
  if (pcV) pcV.addEventListener('connectionstatechange', () => {
    if (chiamataV !== c) return;
    if (pcV.connectionState === 'connected') { send({ type:'connected' }); stato('Collegato: sei in chiamata 3D.'); avviaStats(pcV, 'in'); }
    if (pcV.connectionState === 'failed' || pcV.connectionState === 'closed') chiudiV();
  });
  c.on('stream', s => {
    video.removeAttribute('src');
    video.srcObject = s; video.muted = false;
    hint('Collegamento video…');
    video.play().catch(() => { if (chiamataV === c) hint('Tocca la scena per avviare il video'); });
  });
  c.on('close', chiudiV); c.on('error', chiudiV);
};

function chiudiV(){
  fermaStats();
  fermaRec();
  const c = chiamataV; chiamataV = null;
  if (c) c.close();
  if (micV) micV.getTracks().forEach(t => t.stop());
  micV = null; video.srcObject = null;
  video.removeAttribute('src'); video.load();
  mostraMedia(false);
  hint('In attesa del video…');
  send({ type:'ended' });
  stato('Chiamata terminata. In attesa di chiamata.');
}
handlers.hangup = () => { if (chiamataV) chiudiV(); };
handlers.decline = () => {
  if (attesa) {
    const dc = canali[attesa.peer];
    if (dc && dc.open) dc.send({ t:'decline' }); else { const pr = attesa.peer; rifiutiInSospeso.add(pr); setTimeout(() => rifiutiInSospeso.delete(pr), 5000); }
    attesa.close(); attesa = null;
  }
  send({ type:'ended' }); stato('Chiamata rifiutata. In attesa di chiamata.'); };

$('fileProva').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  $('file').hidden = true;
  if (chiamataV) { stato('Chiudi prima la chiamata per provare un video.'); return; }
  fermaDemo();
  video.srcObject = null;
  mostraMedia(false);
  video.src = URL.createObjectURL(f); video.loop = true; video.muted = false;
  video.play().then(() => stato('Video di prova in riproduzione: ' + f.name))
             .catch(() => { hint('Tocca la scena per avviare il video'); stato('Video caricato: tocca la scena per avviarlo.'); });
  send({ type:'test', name: f.name });
};

/* =================== TRASMISSIONE =================== */
let streamLocale = null, peerS = null, chiamataS = null, canaleS = null, timerSquillo = null;
const cfg = { cam:'', mic:'', res:'3840x1920', bitrate:20000000 };
let attivo = { cam:null, mic:null, res:null };

async function avviaTrasmissione(){
  canvas = $('stage'); canvas.hidden = true;
  $('anteprima').hidden = false;
  hint('Avvio della camera…');
  try {
    const tmp = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    tmp.getTracks().forEach(t => t.stop());
  } catch {
    hint('Permesso camera negato');
    send({ type:'permError', text:'Permesso per camera e microfono negato: abilitalo nelle impostazioni.' });
    return;
  }
  await elenca();
  navigator.mediaDevices.addEventListener('devicechange', elenca);
  avviaAnteprima();
}

async function elenca(){
  const d = await navigator.mediaDevices.enumerateDevices();
  const cams = d.filter(x => x.kind === 'videoinput').map((x, i) => ({ id: x.deviceId, label: x.label || 'Camera ' + (i + 1) }));
  const mics = d.filter(x => x.kind === 'audioinput').map((x, i) => ({ id: x.deviceId, label: x.label || 'Microfono ' + (i + 1) }));
  if (!cams.find(c => c.id === cfg.cam)) cfg.cam = cams[0] ? cams[0].id : '';
  if (!mics.find(m => m.id === cfg.mic)) cfg.mic = mics[0] ? mics[0].id : '';
  send({ type:'devices', cams, mics, cam: cfg.cam, mic: cfg.mic });
}

async function avviaAnteprima(){
  if (streamLocale) streamLocale.getTracks().forEach(t => t.stop());
  const [w, h] = cfg.res.split('x').map(Number);
  attivo = { cam: cfg.cam, mic: cfg.mic, res: cfg.res };
  try {
    streamLocale = await navigator.mediaDevices.getUserMedia({
      video: { ...(cfg.cam ? { deviceId: { exact: cfg.cam } } : {}), width: { ideal: w }, height: { ideal: h }, frameRate: { ideal: 30 } },
      audio: cfg.mic ? { deviceId: { exact: cfg.mic }, echoCancellation: true } : true
    });
  } catch (e) { streamLocale = null; stato('La camera non si avvia: ' + e.message); return; }
  const vt = streamLocale.getVideoTracks()[0];
  vt.contentHint = 'detail';
  $('anteprima').srcObject = streamLocale;
  hint(null);
  const s = vt.getSettings();
  send({ type:'resolution', w: s.width, h: s.height, requested: w });
  stato('Camera pronta. Inserisci il codice del visore.');
}

handlers.config = c => {
  Object.assign(cfg, c.cfg || {});
  if (chiamataS) { impostaBitrate(chiamataS.peerConnection, Number(cfg.bitrate)); for (const o of Object.values(ospiti)) impostaBitrate(o.call.peerConnection, Number(cfg.bitrate)); return; }
  if (cfg.cam !== attivo.cam || cfg.mic !== attivo.mic || cfg.res !== attivo.res) avviaAnteprima();
};

function impostaBitrate(pc, bps){
  if (!pc) return;
  for (const snd of pc.getSenders()) {
    if (!snd.track || snd.track.kind !== 'video') continue;
    const p = snd.getParameters();
    if (!p.encodings || !p.encodings.length) p.encodings = [{}];
    p.encodings[0].maxBitrate = bps;
    snd.setParameters(p).catch(() => {});
  }
}

handlers.call = async c => {
  const codice = String(c.code || '').trim();
  codicePrimario = codice;
  if (!/^\d{6}$/.test(codice)) { stato('Il codice deve avere 6 cifre.'); send({ type:'ended' }); return; }
  if (!streamLocale) { stato('Avvia prima la camera.'); send({ type:'ended' }); return; }
  send({ type:'calling' });
  stato('Chiamata in corso…');
  try {
    if (!peerS || peerS.destroyed) {
      peerS = new Peer();
      peerS.on('error', e => {
        if (e.type === 'peer-unavailable') {
          const m = String(e.message || '').match(/(\d{6})/);
          const codeErr = m && m[1];
          if (codeErr && ospiti[codeErr]) { togliOspite(codeErr, 'notfound'); return; }
          if (chiamataS && codeErr && codeErr !== codicePrimario) return;
        } else if (chiamataS && chiamataS.open && Object.keys(ospiti).length) { stato('Errore di collegamento (' + e.type + ').'); return; }
        stato(e.type === 'peer-unavailable'
          ? 'Codice non trovato: controlla che il visore mostri lo stesso codice.'
          : 'Errore di collegamento (' + e.type + ').');
        fineS();
      });
      await new Promise((ok, ko) => {
        peerS.once('open', ok); peerS.once('error', ko);
        setTimeout(() => ko(new Error('timeout')), 15000);
      });
    }
  } catch (e) {
    if (e && e.message === 'timeout') {
      stato('Il server di collegamento non risponde: riprova tra poco.');
      if (peerS) peerS.destroy();
      fineS();
    }
    return;
  }
  canaleS = peerS.connect(PREFISSO + codice);
  canaleS.on('data', d => {
    if (d && d.t === 'decline') { stato('Chiamata rifiutata dal visore.'); fineS(); }
    if (d && d.t === 'chat' && chiamataS) { const text = String(d.text || '').slice(0, 300); send({ type:'chat', text, from: codicePrimario }); inoltra(canaleS, text, codicePrimario); }
    if (d && d.t === 'react' && chiamataS) reazioneRicevuta(String(d.kind));
  });
  chiamataS = peerS.call(PREFISSO + codice, streamLocale);
  stato('Squilla: attendi che risponda dal visore.');
  timerSquillo = setTimeout(() => { if (chiamataS) { stato('Nessuna risposta dal visore.'); annullaS(); } }, 45000);
  const pc = chiamataS.peerConnection;
  pc.addEventListener('connectionstatechange', () => {
    if (pc.connectionState === 'connected') {
      clearTimeout(timerSquillo);
      impostaBitrate(pc, Number(cfg.bitrate));
      avviaStats(pc, 'out');
      send({ type:'connected' });
      stato('Collegato: sei in onda in 3D.');
    }
    if (pc.connectionState === 'failed') { stato('Collegamento non riuscito: la rete potrebbe bloccare la connessione diretta.'); fineS(); }
  });
  chiamataS.on('stream', r => { $('audioRemoto').srcObject = r; $('audioRemoto').play().catch(() => {}); });
  sorvegliaPrimaria(chiamataS);
};


/* ---------- inviti multipli: altri visori che guardano la stessa trasmissione ---------- */
const ospiti = {}; let codicePrimario = null;
const MAX_OSPITI = 3;
function statoOspite(code, state){ send({ type:'guest', code, state }); }
function togliOspite(code, state){
  const o = ospiti[code]; if (!o) return;
  delete ospiti[code];
  clearTimeout(o.timer);
  if (state === 'removed' && o.dc && o.dc.open && o.state !== 'connected') { try { o.dc.send({ t:'cancel' }); } catch {} }
  try { o.call.close(); } catch {}
  if (o.dc) setTimeout(() => { try { o.dc.close(); } catch {} }, 300);
  statoOspite(code, state);
}
handlers.addGuest = c => {
  const code = String(c.code || '').trim();
  if (!/^\d{6}$/.test(code)) { statoOspite(code, 'invalid'); return; }
  if (!chiamataS || !peerS || !streamLocale) { statoOspite(code, 'notLive'); return; }
  if (code === codicePrimario || ospiti[code]) { statoOspite(code, 'duplicate'); return; }
  if (Object.keys(ospiti).length >= MAX_OSPITI) { statoOspite(code, 'full'); return; }
  const call = peerS.call(PREFISSO + code, streamLocale);
  const dc = peerS.connect(PREFISSO + code);
  const o = { call, dc, state: 'ringing' };
  ospiti[code] = o;
  statoOspite(code, 'ringing');
  dc.on('data', d => {
    if (!d || (ospiti[code] !== o && chiamataS !== o.call)) return;
    if (d.t === 'decline') togliOspite(code, 'declined');
    if (d.t === 'chat') { const text = String(d.text || '').slice(0, 300); send({ type:'chat', text, from: code }); inoltra(o.dc, text, code); }
    if (d.t === 'react') reazioneRicevuta(String(d.kind));
  });
  o.timer = setTimeout(() => { if (ospiti[code] === o && o.state === 'ringing') togliOspite(code, 'noanswer'); }, 45000);
  const pc = call.peerConnection;
  if (pc) pc.addEventListener('connectionstatechange', () => {
    if (ospiti[code] !== o) return;
    if (pc.connectionState === 'connected') { clearTimeout(o.timer); o.state = 'connected'; impostaBitrate(pc, Number(cfg.bitrate)); statoOspite(code, 'connected'); }
    if (pc.connectionState === 'failed') togliOspite(code, 'failed');
  });
  call.on('close', () => { if (ospiti[code] === o) togliOspite(code, 'ended'); });
};
handlers.removeGuest = c => togliOspite(String(c.code || ''), 'removed');
function inoltra(da, text, code){
  // chat di gruppo: chi trasmette inoltra il messaggio di un visore a tutti gli altri
  for (const dc of canaliUscita()) if (dc !== da) { try { dc.send({ t:'chat', text, from: code }); } catch {} }
}
let vidParti = [];
handlers.vidChunk = c => {
  if (MODE !== 'viewer' || chiamataV) return;
  if (c.i === 0) { vidParti = []; hint('Carico la registrazione…'); }
  const bin = atob(String(c.data || '')); const u = new Uint8Array(bin.length);
  for (let k = 0; k < bin.length; k++) u[k] = bin.charCodeAt(k);
  vidParti.push(u);
  if (c.i !== c.n - 1) return;
  const blob = new Blob(vidParti, { type: String(c.mime || 'video/mp4') }); vidParti = [];
  fermaDemo(); video.srcObject = null;
  video.src = URL.createObjectURL(blob); video.loop = true; video.muted = false;
  video.play().then(() => stato('Registrazione in riproduzione. Guardati intorno.'))
             .catch(() => { hint('Tocca la scena per avviare il video'); stato('Registrazione pronta: tocca la scena per avviarla.'); });
  send({ type:'test', name:'video' });
};
function canaliUscita(){
  const out = [];
  if (MODE === 'sender') { if (chiamataS && canaleS) out.push(canaleS); for (const o of Object.values(ospiti)) if (o.dc) out.push(o.dc); }
  else if (chiamataV && canali[chiamataV.peer]) out.push(canali[chiamataV.peer]);
  return out.filter(d => d.open);
}

function sorvegliaPrimaria(call){
  call.on('close', () => {
    if (chiamataS !== call) return;
    const conn = Object.entries(ospiti).find(([, o]) => o.state === 'connected');
    if (!conn) { fineS(); stato('Chiamata terminata.'); return; }
    // il visore principale ha chiuso: un ospite diventa il principale e la trasmissione continua
    const [code, o] = conn;
    clearTimeout(o.timer); delete ospiti[code];
    const vecchioDc = canaleS;
    chiamataS = o.call; canaleS = o.dc; codicePrimario = code;
    if (vecchioDc) setTimeout(() => { try { vecchioDc.close(); } catch {} }, 300);
    canaleS.on('data', d => { if (d && d.t === 'decline' && chiamataS === o.call) { stato('Chiamata rifiutata dal visore.'); fineS(); } });
    sorvegliaPrimaria(o.call);
    const pcP = o.call.peerConnection;
    if (pcP) pcP.addEventListener('connectionstatechange', () => {
      if (chiamataS === o.call && pcP.connectionState === 'failed') { stato('Collegamento perso con il visore.'); fineS(); }
    });
    avviaStats(pcP, 'out');
    statoOspite(code, 'promoted');
    stato('Il visore principale ha chiuso: continui a trasmettere a ' + code + '.');
  });
}

function annullaS(){
  if (canaleS && canaleS.open) { try { canaleS.send({ t:'cancel' }); } catch {} }
  fineS();
}
function fineS(){
  for (const k of Object.keys(ospiti)) togliOspite(k, 'ended');
  codicePrimario = null;
  fermaStats();
  fermaRec();
  clearTimeout(timerSquillo);
  const c = chiamataS; chiamataS = null;
  if (c) c.close();
  const dc = canaleS; canaleS = null;
  if (dc) setTimeout(() => dc.close(), 300);
  $('audioRemoto').srcObject = null;
  send({ type:'ended' });
}
handlers.hangup = MODE === 'sender' ? () => { annullaS(); stato('Chiamata terminata.'); } : handlers.hangup;


/* ---------- reazioni che fluttuano nella scena 3D ---------- */
const REAZIONI = { heart: '\u2764\uFE0F', clap: '\uD83D\uDC4F', star: '\u2B50', like: '\uD83D\uDC4D', wow: '\uD83E\uDD29' };
const texReazioni = {};
let attive = [], ultimaReazione = 0, ultimoFrame = 0;
function texReazione(kind){
  if (texReazioni[kind]) return texReazioni[kind];
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d');
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.font = '96px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  x.fillText(REAZIONI[kind], 64, 72);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return (texReazioni[kind] = t);
}
const vDir = new THREE.Vector3(), vRight = new THREE.Vector3(), vUp = new THREE.Vector3(0, 1, 0);
function lanciaReazione(kind){
  if (MODE !== 'viewer' || !REAZIONI[kind] || attive.length > 40) return;
  camera.getWorldDirection(vDir);
  const w = canvas.clientWidth / (vista === 'split' ? 2 : 1), h = canvas.clientHeight || 1;
  const hfov = 2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2) * (w / h));
  const yawRnd = (Math.random() - 0.5) * Math.min(0.6, hfov * 0.5);
  vDir.applyAxisAngle(vUp, yawRnd).normalize();
  vRight.crossVectors(vDir, vUp).normalize();
  const dist = 3, base = vDir.clone().multiplyScalar(dist).add(new THREE.Vector3(0, -0.6 + Math.random() * 0.3, 0));
  const disp = 0.09; // differenza tra occhi: la reazione appare davanti al video
  const coppia = [];
  for (const [layer, segno] of [[1, -1], [2, 1]]) {
    const m = new THREE.SpriteMaterial({ map: texReazione(kind), transparent: true, depthTest: false });
    const sp = new THREE.Sprite(m);
    sp.scale.set(0.45, 0.45, 1); sp.renderOrder = 10;
    sp.layers.set(layer);
    sp.position.copy(base).addScaledVector(vRight, segno * disp / 2);
    scena.add(sp); coppia.push(sp);
  }
  attive.push({ coppia, nato: performance.now(), deriva: (Math.random() - 0.5) * 0.25, right: vRight.clone() });
}
function animaReazioni(){
  const ora = performance.now();
  const dt = ultimoFrame ? Math.min(0.1, (ora - ultimoFrame) / 1000) : 1 / 60;
  ultimoFrame = ora;
  if (!attive.length) return;
  attive = attive.filter(r => {
    const t = (ora - r.nato) / 1000;
    if (t > 3) { r.coppia.forEach(sp => { scena.remove(sp); sp.material.dispose(); }); return false; }
    for (const sp of r.coppia) {
      sp.position.y += 0.72 * dt;
      sp.position.addScaledVector(r.right, (Math.sin(t * 3) * 0.12 + r.deriva * 0.24) * dt);
      sp.material.opacity = t < 2 ? 1 : 1 - (t - 2);
      const k = 0.45 * (t < 0.25 ? 0.4 + t * 2.4 : 1);
      sp.scale.set(k, k, 1);
    }
    return true;
  });
}
handlers.react = c => {
  const kind = String(c.kind || '');
  if (!REAZIONI[kind]) return;
  const ora = performance.now();
  if (ora - ultimaReazione < 200) return;
  ultimaReazione = ora;
  for (const dc of canaliUscita()) { try { dc.send({ t:'react', kind }); } catch {} }
  lanciaReazione(kind);
};
function reazioneRicevuta(kind){
  if (!REAZIONI[kind]) return;
  lanciaReazione(kind);
  send({ type:'react', kind });
}


/* ---------- foto 3D e registrazione ---------- */
const nativo = !!window.ReactNativeWebView;
const ora8 = () => new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
function scarica(url, nome){ const a = document.createElement('a'); a.href = url; a.download = nome; document.body.appendChild(a); a.click(); a.remove(); }

handlers.snapshot = () => {
  const src = demo ? demoCanvas : (video && video.videoWidth ? video : null);
  if (!src) { send({ type:'snapError', text:'Nessun video da fotografare.' }); return; }
  const w0 = demo ? src.width : src.videoWidth, h0 = demo ? src.height : src.videoHeight;
  const k = Math.min(1, 4096 / w0);
  const c = document.createElement('canvas'); c.width = Math.round(w0 * k); c.height = Math.round(h0 * k);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  const nome = 'VR180-foto-' + ora8() + (formato === 'sbs' ? '_SBS' : '_TB') + '.jpg';
  const data = c.toDataURL('image/jpeg', 0.92);
  if (nativo) send({ type:'snapshot', name: nome, data: data.split(',')[1] });
  else { scarica(data, nome); send({ type:'snapshot', name: nome, web: true }); }
};

let registratore = null, pezzi = [], timerMaxRec = null;
function sceltaMime(){
  for (const m of ['video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'])
    if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m;
  return '';
}
handlers.recStart = () => {
  if (registratore) return;
  const stream = MODE === 'sender' ? streamLocale : (video && video.srcObject);
  if (!stream || !window.MediaRecorder) { send({ type:'recError', text:'Registrazione non disponibile su questo dispositivo.' }); return; }
  const mime = sceltaMime();
  try { registratore = new MediaRecorder(stream, { ...(mime ? { mimeType: mime } : {}), videoBitsPerSecond: 8000000 }); }
  catch (e) { registratore = null; send({ type:'recError', text:'Registrazione non avviata: ' + e.message }); return; }
  pezzi = [];
  registratore.ondataavailable = e => { if (e.data && e.data.size) pezzi.push(e.data); };
  registratore.onstop = salvaRegistrazione;
  registratore.start(1000);
  timerMaxRec = setTimeout(fermaRec, 5 * 60 * 1000);
  send({ type:'recStarted' });
};
function fermaRec(){ clearTimeout(timerMaxRec); if (registratore && registratore.state !== 'inactive') registratore.stop(); }
handlers.recStop = fermaRec;
const leggi64 = b => new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1] || ''); r.onerror = ko; r.readAsDataURL(b); });
async function salvaRegistrazione(){
  const mime = (registratore && registratore.mimeType) || 'video/webm';
  registratore = null;
  const blob = new Blob(pezzi, { type: mime }); pezzi = [];
  const ext = mime.includes('mp4') ? 'mp4' : 'webm';
  const nome = 'VR180-chiamata-' + ora8() + '.' + ext;
  if (!blob.size) { send({ type:'recError', text:'Registrazione vuota.' }); return; }
  if (!nativo) { scarica(URL.createObjectURL(blob), nome); send({ type:'recSaved', name: nome, web: true }); return; }
  const CH = 3 * 256 * 1024, n = Math.ceil(blob.size / CH);
  for (let i = 0; i < n; i++) {
    const data = await leggi64(blob.slice(i * CH, (i + 1) * CH));
    send({ type:'recChunk', i, n, data, name: nome, mime: mime.split(';')[0] });
  }
}

/* ---------- chat durante la chiamata ---------- */
handlers.chat = c => {
  const text = String(c.text || '').slice(0, 300);
  const dcs = canaliUscita();
  let ok = false;
  for (const dc of dcs) { try { dc.send({ t:'chat', text }); ok = true; } catch {} }
  if (text && ok) { send({ type:'chatSent', id: c.id }); return; }
  send({ type:'chatError', id: c.id });
};

/* ---------- avvio ---------- */
if (MODE === 'sender') { $('stage').hidden = true; avviaTrasmissione(); }
else avviaVisore();
send({ type:'ready', mode: MODE });
</script>
