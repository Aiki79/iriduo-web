<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>IriDuo · codice {{CODE}}</title>
<meta property="og:title" content="IriDuo · codice {{CODE}}">
<meta property="og:description" content="IriDuo — a tu per tu, in 3D. Tocca per aprire l'app e chiamare il visore.">
<style>
  html,body{margin:0;min-height:100%;background:#0E1A2B;color:#EAF0F7;font-family:system-ui,sans-serif}
  main{max-width:480px;margin:0 auto;padding:48px 24px;text-align:left}
  .tag{color:#5CC8E0;font-weight:700;letter-spacing:.15em;font-size:13px}
  h1{font-size:30px;margin:8px 0 4px}
  .slogan{color:#5CC8E0;font-weight:700;margin:0 0 8px}
  p{color:#9DB0C8;font-size:17px;line-height:1.5}
  .code{font-size:56px;font-weight:700;letter-spacing:.18em;color:#5CC8E0;margin:16px 0}
  a.btn{display:block;text-align:center;background:#5CC8E0;color:#0E1A2B;font-weight:700;font-size:18px;
    padding:18px;border-radius:14px;text-decoration:none;margin-top:24px}
</style>
</head>
<body>
<main>
  <div class="tag" id="tag">IRIDUO · CHIAMATA 3D</div>
  <h1 id="h1">Sei invitato a una chiamata 3D</h1>
  <p class="slogan" id="slogan">A tu per tu, in 3D</p>
  <p id="lbl">Codice del visore:</p>
  <div class="code" id="code">{{CODE}}</div>
  <a class="btn" id="open" href="{{APP_URL}}">Apri l'app e chiama</a>
  <p id="help">Se l'app non si apre, aprila tu, scegli “Chiama con la camera 3D” e inserisci il codice qui sopra.</p>
</main>
<script>
// Language of the person opening the link (not of who sent it)
if (!/^it/i.test(navigator.language || '')) {
  document.documentElement.lang = 'en';
  var t = { tag: 'IRIDUO · 3D CALL', h1: "You're invited to a 3D call", slogan: 'Face to face, in 3D', lbl: 'Headset code:', open: 'Open the app and call',
    help: 'If the app doesn\u2019t open, open it yourself, choose \u201cCall with the 3D camera\u201d and enter the code above.' };
  for (var k in t) document.getElementById(k).textContent = t[k];
}
setTimeout(function(){ location.href = document.getElementById('open').href; }, 300);</script>
</body>
</html>
